name: Auto-tag on version bump

# Creates a v{version} tag whenever package.json's version on main
# doesn't yet have a matching tag, then immediately triggers release.yml
# via `gh workflow run` (tag pushes made with GITHUB_TOKEN do not fire
# downstream workflows due to GitHub's loop-prevention policy).

on:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  auto-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag if package.json version has no matching tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(jq -r .version package.json)
          TAG="v${VERSION}"
          if git rev-parse "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists — nothing to do."
            exit 0
          fi
          echo "Creating tag ${TAG} at $(git rev-parse HEAD)"
          git tag "${TAG}"
          git push origin "${TAG}"
          echo "Triggering release.yml for ${TAG}"
          gh workflow run release.yml --ref "${TAG}"
